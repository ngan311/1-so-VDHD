<div th:replace="layout/header"></div>
<div th:replace="layout/sidebar"></div>

<div class="content">
    <h2>Danh sách phòng chơi</h2>

    <table>
        <tr>
            <th>Tên phòng</th>
            <th>Game</th>
            <th>Số người</th>
            <th>Chế độ</th>
            <th>Trạng thái</th>
        </tr>
        <tr th:each="r : ${rooms}">
            <td th:text="${r.name}"></td>
            <td th:text="${r.game.name}"></td>
            <td th:text="${r.currentPlayers + '/' + r.maxPlayers}"></td>
            <td th:text="${r.mode}"></td>
            <td th:text="${r.active ? 'Mở' : 'Đóng'}"></td>
        </tr>
    </table>
</div>

<div th:replace="layout/footer"></div>
